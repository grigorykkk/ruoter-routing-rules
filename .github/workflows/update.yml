name: Update RU routing list

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - domains.txt
      - .github/workflows/update.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ru-routing-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build ru-routing.txt
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f ru-ipv4-source.txt' EXIT

          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            "https://raw.githubusercontent.com/ipverse/country-ip-blocks/master/country/ru/ipv4-aggregated.txt" \
            --output ru-ipv4-source.txt

          python3 <<'PY'
          from ipaddress import IPv4Network
          from pathlib import Path
          from string import ascii_letters, digits
          import sys

          allowed = set(ascii_letters + digits + "-")

          def valid_flint_domain(value: str) -> bool:
              if "." not in value or value[0] not in ascii_letters or len(value) > 253:
                  return False
              labels = value.split(".")
              return all(
                  1 <= len(label) <= 63
                  and label[0] in ascii_letters + digits
                  and label[-1] in ascii_letters + digits
                  and set(label) <= allowed
                  for label in labels
              )

          domains = []
          invalid_domains = []
          for raw in Path("domains.txt").read_text(encoding="utf-8").splitlines():
              value = raw.strip().lower()
              if not value or value.startswith("#"):
                  continue
              if valid_flint_domain(value):
                  domains.append(value)
              else:
                  invalid_domains.append(value)

          domains = list(dict.fromkeys(domains))

          if invalid_domains:
              print(
                  "Skipped domains rejected by the Flint 2 validator: "
                  + ", ".join(invalid_domains),
                  file=sys.stderr,
              )

          networks = []
          invalid_networks = []
          for raw in Path("ru-ipv4-source.txt").read_text(encoding="utf-8").splitlines():
              value = raw.strip()
              if not value or value.startswith("#"):
                  continue
              try:
                  networks.append(str(IPv4Network(value, strict=True)))
              except ValueError:
                  invalid_networks.append(value)

          if invalid_networks:
              print(
                  "The RU IP source contains invalid IPv4/CIDR entries: "
                  + ", ".join(invalid_networks),
                  file=sys.stderr,
              )
              raise SystemExit(1)

          result = list(dict.fromkeys(domains + networks))
          if not result:
              raise SystemExit("The generated routing list is empty")

          Path("ru-routing.txt").write_text(
              "\n".join(result) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit updated list
        shell: bash
        run: |
          if git diff --quiet -- ru-routing.txt; then
            echo "ru-routing.txt is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru-routing.txt
          git commit -m "Update RU routing list"
          git push
